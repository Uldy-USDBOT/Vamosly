<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>vamos.ly — نطاق للبيع</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Almarai:wght@400;700;800&family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --royal:#1e3ae0;
    --royal-deep:#0e1d7a;
    --royal-mid:#2c49f0;
    --ink:#101833;
    --paper:#eef1f7;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{overflow-x:hidden; width:100%;}
  body{
    min-height:100vh;
    background:
      /* center circle */
      radial-gradient(circle 90px at 50% 50%, transparent 87px, rgba(255,255,255,0.55) 88px, rgba(255,255,255,0.55) 91px, transparent 92px),
      /* halfway line */
      linear-gradient(90deg, transparent calc(50% - 1.5px), rgba(255,255,255,0.55) calc(50% - 1.5px), rgba(255,255,255,0.55) calc(50% + 1.5px), transparent calc(50% + 1.5px)),
      /* mow stripes */
      repeating-linear-gradient(90deg, #2fa85f 0px, #2fa85f 70px, #279952 70px, #279952 140px);
    font-family:'Almarai', sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:28px 14px;
  }
  a{color:inherit; text-decoration:none;}

  .ad-card{
    width:100%;
    max-width:560px;
    background:#fff;
    border-radius:22px;
    overflow:hidden;
    box-shadow:0 30px 60px -20px rgba(16,24,51,0.28);
  }

  /* ===== TOP BAR ===== */
  .top-bar{
    display:flex; align-items:center;
    padding:16px 20px;
  }
  .brand{ display:flex; align-items:center; gap:10px; }
  .brand-mark{
    width:38px; height:38px; border-radius:50%;
    background:linear-gradient(135deg, var(--royal-mid), var(--royal-deep));
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
  }
  .brand-mark svg{width:20px; height:20px;}
  .brand-name{
    font-family:'Manrope', sans-serif;
    font-weight:800;
    font-size:19px;
    color:var(--royal);
    letter-spacing:-0.5px;
  }
  .sponsor-tag{
    text-align:left;
    font-size:11.5px;
    color:#7c8296;
    line-height:1.5;
  }

  /* ===== HERO ILLUSTRATION ===== */
  .hero-wrap{
    position:relative;
    width:100%;
    aspect-ratio:997/490;
    overflow:hidden;
  }
  .hero-wrap img{ width:100%; height:100%; display:block; object-fit:cover; }

  /* ===== BLUE PANEL ===== */
  .blue-panel{
    background:linear-gradient(180deg, #12207a 0%, #0c1a6e 55%, #0a1660 100%);
    padding:26px 22px 24px;
    color:#fff;
  }
  .headline{
    font-family:'Almarai', sans-serif;
    font-weight:800;
    font-size:clamp(21px, 5.5vw, 27px);
    line-height:1.25;
  }
  .subtext{
    margin-top:8px;
    font-size:13.5px;
    line-height:1.8;
    color:#c6cdf0;
    max-width:480px;
  }

  .icon-row{
    display:flex;
    justify-content:space-between;
    gap:8px;
    margin-top:20px;
    flex-wrap:wrap;
  }
  .icon-item{
    flex:1 1 0;
    min-width:90px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:7px;
    text-align:center;
  }
  .icon-item .ic{
    width:34px; height:34px;
    display:flex; align-items:center; justify-content:center;
  }
  .icon-item .ic svg{width:22px; height:22px; stroke:#fff; fill:none;}
  .icon-item span{
    font-size:12px;
    font-weight:700;
    color:#eef1ff;
  }

  .wa-pill{
    margin-top:22px;
    display:flex;
    align-items:center;
    gap:10px;
    background:#fff;
    border-radius:999px;
    padding:12px 16px;
    justify-content:center;
  }
  .wa-pill svg{width:22px; height:22px; flex-shrink:0;}
  .wa-pill span{
    font-family:'Almarai', sans-serif;
    font-weight:800;
    font-size:clamp(13px, 3.6vw, 16px);
    color:var(--ink);
    direction:ltr;
    unicode-bidi:isolate;
  }

  .arrow-line{
    margin-top:12px;
    text-align:center;
    font-size:12.5px;
    color:#c6cdf0;
  }

  .cta-btn{
    margin-top:16px;
    display:flex;
    align-items:center;
    justify-content:center;
    width:100%;
    background:linear-gradient(135deg, #3b5bff, #2440d6);
    color:#fff;
    font-family:'Almarai', sans-serif;
    font-weight:800;
    font-size:16px;
    padding:15px;
    border-radius:14px;
    border:1px solid rgba(255,255,255,0.15);
    transition:transform .2s ease, box-shadow .2s ease;
    box-shadow:0 14px 26px -10px rgba(36,64,214,0.7);
  }
  .cta-btn:hover{ transform:translateY(-2px); }
</style>
</head>
